server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Gzip Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ─── HTML: no-cache (always revalidate) ──────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # ─── Vite Hashed Assets: 1 year immutable ────────────────────────────────
    # Vite adds content hash to filenames — safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # ─── Self-hosted Fonts: 1 year immutable ─────────────────────────────────
    # Filenames are stable (no hash) but content never changes
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Access-Control-Allow-Origin "*";
    }

    # ─── Static Public Images: 1 year ────────────────────────────────────────
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # ─── sitemap, robots: 5 minutes ──────────────────────────────────────────
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # ─── SPA Fallback (semua route ke index.html) ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
