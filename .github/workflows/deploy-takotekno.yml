name: Deploy TakoTekno Page

on:
  push:
    branches: [ "master" ]
    # Hanya jalan jika ada perubahan di folder proyek ini
    paths:
      - 'tako-tekno-solutions/takotekno/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          # Arahkan ke folder proyek Anda
          context: ./tako-tekno-solutions/takotekno/takotekno-807fdab8f6e53e6959ac6e34b82e3fb8c1eeb2ea
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/takotekno-page:latest

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Copy file docker-compose.yml saja ke VPS
      - name: Copy config to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "tako-tekno-solutions/takotekno/takotekno-807fdab8f6e53e6959ac6e34b82e3fb8c1eeb2ea/docker-compose.yml"
          target: "/root/containers/takotekno"
          strip_components: 4
          rm: false

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            export $(cat /root/.env | xargs)

            cd /root/containers/takotekno

            docker-compose pull

            docker-compose up -d --force-recreate

            docker image prune -f